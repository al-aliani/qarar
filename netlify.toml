[build]
  command = "npm run build"
  publish = "web/dist"

# الواجهة العامة: الجذر يعرض صفحة الهبوط التسويقية (لا الأداة الخام).
# force = true يتجاوز index.html الثابت في dist مع إبقاء الرابط نظيفاً على "/".
# الأداة تبقى مباشرةً على /index.html، وروابط الهبوط النسبية (./index.html) تفتحها.
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200
  force = true

# SPA fallback: paths without matching static files → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers for hashed assets (CDN)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ملفات JS/CSS المبصومة — تخزين مؤقت طويل (مطابق لـ vercel.json)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# رؤوس الأمان — مطابقة لـ vercel.json. HSTS وX-Frame-Options لا يمكن ضبطها عبر
# <meta> فيجب أن تأتي كرؤوس HTTP فعلية من الاستضافة.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src https://www.openstreetmap.org https://www.google.com https://www.recaptcha.net; connect-src 'self' https://*.supabase.co https://www.google.com https://www.recaptcha.net https://overpass-api.de https://api.worldbank.org; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# استثناء: عامل الخدمة والـmanifest يجب ألا يُخزَّنا طويلاً وإلا تعذّر تحديث PWA.
# يأتي بعد قاعدة /*.js ليتغلّب عليها لهذين المسارين.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
