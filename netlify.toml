[build]
  command = "npm run build"
  publish = "web/dist"

# SPA fallback: paths without matching static files → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers for hashed assets (CDN)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
