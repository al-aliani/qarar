# تدقيق 2026-07-08 (ملاحظة حرجة، المدقّق الأمني): سياسات RLS التي تحمي جدول studies
# (كل الدراسات المالية لكل المستخدمين) كانت موجودة فقط كملف SQL يدوي التطبيق
# (supabase/migrations/20260708090000_enable_rls_studies.sql) — خطأ تشغيلي واحد
# (نسيان لصقه في Supabase Dashboard) = بيانات كل العملاء مكشوفة عبر مفتاح anon العام.
#
# هذه الوظيفة تُشغّل `supabase db push` آلياً على كل push لفرع main، بدل الاعتماد على
# خطوة يدوية. لا تحتاج انتظار أي عمل بشري بعد إضافة الأسرار الثلاثة التالية:
#   Settings → Secrets and variables → Actions → New repository secret:
#     - SUPABASE_ACCESS_TOKEN   (من https://supabase.com/dashboard/account/tokens)
#     - SUPABASE_PROJECT_REF    (معرّف المشروع — من رابط لوحة تحكم المشروع)
#     - SUPABASE_DB_PASSWORD    (كلمة مرور قاعدة البيانات — Project Settings → Database)
#
# بلا هذه الأسرار: الوظيفة تُخطي خطوة النشر بأمان (لا تفشل البناء) وتطبع تحذيراً —
# فلا يوقف هذا أي شيء حتى تُضاف الأسرار الحقيقية، لكنه أيضاً لا يترك RLS يدوياً منسياً
# صامتاً إلى الأبد كما كان الحال.
name: Supabase DB Migrations

# تدقيق 2026-08-29 (المرحلة 1.2، خطة إعادة تقييم الطبقات الـ16): كانت هذه الورشة
# تعمل بالتوازي مع الاختبارات (push مباشر) لا بعدها — فيمكن لترحيل يكسر الاختبارات
# أن يُنشَر على القاعدة الحيّة قبل أن يُبلغ CI بالفشل أصلاً. التبديل لـworkflow_run
# يجعل النشر ينتظر اكتمال "E2E Tests" (ci.yml اندمجت فيها بالمرحلة 1.2) بنجاح فعلي.
#
# أربعة مزالق تعامَل معها هذا الملف صراحة:
# 1) `paths:` يسقط صامتاً تحت workflow_run — خطوة check_paths أدناه (git diff يدوي)
#    تعوّض عن ذلك، وإلا صار كل دفع أخضر يُعيد تشغيل db push حتى لو لم تتغيّر أي
#    ترحيلة، وهو غير خطير هنا (idempotent) لكنه تكلفة بلا داعٍ.
# 2) actions/checkout@v4 يجلب افتراضياً رأس الفرع الافتراضي لا الالتزام المُختبَر
#    فعلياً تحت workflow_run — `ref: head_sha` أدناه إلزامي.
# 3) شرط الوظيفة يسمح صراحة بـworkflow_dispatch (المخرج اليدوي) بجانب اشتراط نجاح
#    E2E Tests، وإلا تعطّل التشغيل اليدوي كلياً.
# 4) fetch-depth: 2 مطلوبة لـcheck_paths (تحتاج مقارنة HEAD مقابل أبيها المباشر).
on:
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: supabase-db-migrations-${{ github.ref }}
  # إلزامي false: `db push --include-all` يطبّق ملفات SQL تتابعاً بلا معاملة شاملة،
  # وكل ملف يُسجَّل في سجلّ schema_migrations فور نجاحه — إلغاء منتصف التشغيل يترك
  # السجلّ متقدّماً جزئياً بلا أي إشارة تدل على ذلك لاحقاً.
  cancel-in-progress: false

jobs:
  db-migrations:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Check if migrations changed in this push
        id: check_paths
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD~1 >/dev/null 2>&1 && git diff --name-only HEAD~1 HEAD | grep -q '^supabase/migrations/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Supabase secrets are configured
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && [ -n "${{ secrets.SUPABASE_PROJECT_REF }}" ] && [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::أسرار Supabase (SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_REF/SUPABASE_DB_PASSWORD) غير مضبوطة بعد في إعدادات المستودع — تخطّي نشر ترحيلات RLS. هذا لا يعني أن RLS مفعّلة على المشروع الفعلي؛ أضف الأسرار الثلاثة لتفعيل النشر الآلي."
          fi

      - name: Push migrations (enables RLS on public.studies) to Supabase
        if: steps.check_secrets.outputs.configured == 'true' && steps.check_paths.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" -p "${{ secrets.SUPABASE_DB_PASSWORD }}"
          # 2026-08-28: --include-all مطلوب فعلياً — عطل حي وُجد أول مرة اليوم عبر
          # https://github.com/al-aliani/qarar/actions/runs/33147806030. عدة فروع
          # ترحيل مستقلة (مطوَّرة بالتوازي بنفس اليوم) تحمل أختاماً زمنية لا تتسلسل
          # بترتيب الدمج الفعلي — CLI supabase يرفض بأمان أي ترحيل أقدم من آخر
          # ترحيل مُسجَّل على القاعدة الحية، حتى لو كان محتواه آمناً كلياً للتطبيق
          # خارج الترتيب. كل ترحيل في هذا المستودع idempotent بامتداد (IF NOT
          # EXISTS/DROP...IF EXISTS ثم CREATE) بالفعل — تُحقَّق منه مراجعة عدائية
          # قبل كل دمج (انظر PR #36 مثالاً) — فتجاوز هذا الحارس هنا آمن، لا يُخفي
          # فشلاً حقيقياً في المحتوى نفسه.
          npx supabase db push --include-all
