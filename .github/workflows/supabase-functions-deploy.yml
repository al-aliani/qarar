# تدقيق 2026-07-09 (أتمتة الدفع): نشر Edge Functions (create-checkout/webhook-moyasar/
# webhook-stripe) + دفع أسرار مزوّدي الدفع إلى Supabase تلقائياً على كل push يمسّ
# supabase/functions/** — نفس نمط supabase-migrations.yml (تخطٍّ آمن بلا فشل بناء
# إن غابت الأسرار، تحذير واضح بدل صمت).
#
# أسرار يجب إضافتها في: Settings → Secrets and variables → Actions → New repository secret
#
# مطلوبة لأي نشر (نفس أسرار الترحيلات — إن كانت مضبوطة أصلاً لن تحتاج تكرارها):
#   - SUPABASE_ACCESS_TOKEN، SUPABASE_PROJECT_REF، SUPABASE_DB_PASSWORD
#
# مطلوبة لعمل الدفع فعلياً (تُدفع كأسرار Supabase عبر `supabase secrets set` —
# لا تُكتب هنا مباشرة، فقط تُشار إليها من GitHub Secrets):
#   - SUPABASE_URL، SUPABASE_ANON_KEY، SUPABASE_SERVICE_ROLE_KEY (Project Settings → API)
#   - APP_ORIGIN (رابط الموقع الفعلي، مثال: https://qarar.app)
#   - MOYASAR_SECRET_KEY، MOYASAR_WEBHOOK_SECRET (لوحة تحكم Moyasar → API Keys / Webhooks)
#   - STRIPE_SECRET_KEY، STRIPE_WEBHOOK_SECRET (لوحة تحكم Stripe → Developers → API keys / Webhooks)
#
# مطلوبة لتحقق واتساب الحقيقي عند التسجيل (2026-07-17):
#   - WHATSAPP_ACCESS_TOKEN، WHATSAPP_PHONE_NUMBER_ID (WhatsApp Business Platform
#     من ميتا — Meta Business Account + Cloud API، يتطلب موافقة خارجية على حساب
#     حقيقي، لا بديل تجريبي/محلي لهذا)
#   - WHATSAPP_TEMPLATE_NAME، WHATSAPP_TEMPLATE_LANG (اسم/لغة قالب Authentication
#     المعتمد فعلياً من ميتا لحسابكم — يختلف حسب ما يوافقون عليه)
#   - OTP_HASH_SECRET (سرّ عشوائي جديد خاص بهذا المشروع فقط — غير مرتبط بأي حساب
#     خارجي، لهاش رموز التحقق قبل تخزينها؛ ولّده بنفسك، مثال: openssl rand -hex 32)
#
# مطلوبة لتفعيل موصّل Google Places (منافسون بدقّة — تسويق، 2026-07-17):
#   - GOOGLE_PLACES_API_KEY (Google Cloud Console → APIs & Services → Credentials؛
#     فعّل Places API. المفتاح يبقى على الخادم فقط — places-nearby/index.ts لا
#     GooglePlacesConnector.js في العميل. بدون هذا السرّ يبقى الموصّل يُعيد
#     unavailable بأمان، لا خطأ نشر)
#
# كل سرّ غائب يُتخطّى بتحذير واضح بدل إيقاف النشر بالكامل — يمكن تفعيل مزوّد واحد
# أولاً (مثلاً Moyasar فقط) وإضافة الآخر لاحقاً بلا أي تعديل كود.

name: Supabase Edge Functions Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase link secrets are configured
        id: check_link_secrets
        run: |
          if [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && [ -n "${{ secrets.SUPABASE_PROJECT_REF }}" ] && [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::أسرار ربط Supabase (SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_REF/SUPABASE_DB_PASSWORD) غير مضبوطة — تخطّي نشر Edge Functions بالكامل."
          fi

      - name: Link Supabase project
        if: steps.check_link_secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" -p "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: "Deploy create-checkout (يتطلب JWT مستخدم حقيقي — تحقق مزدوج: منصة Supabase + تحقق داخلي إضافي في الدالة)"
        if: steps.check_link_secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions deploy create-checkout

      # --no-verify-jwt هنا (لا في create-checkout أعلاه): منصة Supabase تتحقق
      # افتراضياً من JWT قبل تشغيل أي دالة — يمنع webhook-moyasar/webhook-stripe من
      # العمل إطلاقاً لو تُرك الافتراضي، لأن مزوّدي الدفع خدمتان خارجيتان لا ترسلان
      # أي JWT مستخدم. التحقق الحقيقي لهذين المسارين هو توقيع/سرّ الـwebhook نفسه
      # (webhookVerify.ts) — طبقة حماية مستقلة تماماً عن Supabase JWT.
      - name: "Deploy webhook-moyasar / webhook-stripe / webhook-tamara (بلا تحقق JWT منصّة — التحقق عبر توقيع المزوّد نفسه)"
        if: steps.check_link_secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase functions deploy webhook-moyasar --no-verify-jwt
          npx supabase functions deploy webhook-stripe --no-verify-jwt
          npx supabase functions deploy webhook-tamara --no-verify-jwt

      - name: "Deploy whatsapp-otp-send / whatsapp-otp-verify (تتطلبان JWT مستخدم حقيقي، نفس نمط create-checkout)"
        if: steps.check_link_secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase functions deploy whatsapp-otp-send
          npx supabase functions deploy whatsapp-otp-verify

      - name: "Deploy check-name-availability (JWT مستخدم حقيقي، بلا أسرار — فحوصات صادرة فقط)"
        if: steps.check_link_secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions deploy check-name-availability

      - name: "Deploy places-nearby (JWT مستخدم حقيقي، يتطلب GOOGLE_PLACES_API_KEY)"
        if: steps.check_link_secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions deploy places-nearby

      # تدقيق 2026-08-21: الثلاث كانت مبنيّة بالكود منذ 2026-07-13 (migration
      # 20260713000000_reviewer_portal.sql مُطبَّقة فعلاً على القاعدة الحيّة) لكن بلا
      # خطوة نشر هنا إطلاقاً — 404 حيّ لباقة «مراجَع بخبير» (1,999 ﷼) رغم بيعها فعلياً.
      # JWT مستخدم حقيقي (نفس نمط create-checkout)، بلا أسرار إضافية.
      - name: "Deploy reviewer-queue / reviewer-claim / reviewer-submit (بوابة مراجعة الخبراء)"
        if: steps.check_link_secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase functions deploy reviewer-queue
          npx supabase functions deploy reviewer-claim
          npx supabase functions deploy reviewer-submit

      # تدقيق 2026-08-22: مبنيّة بالكود (تعليقها الداخلي يوثّق --no-verify-jwt
      # صراحةً) لكن غائبة عن هذه الورشة كلياً — 404 حيّ لأي مراقبة خارجية
      # (UptimeRobot/Sentry Cron) تستدعي /functions/v1/health. بلا JWT (فحص صحّي
      # عام)، بلا أسرار إضافية غير SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY الموجودين
      # أصلاً في خطوة دفع الأسرار أدناه.
      - name: "Deploy health (فحص صحّي عام بلا JWT — لمراقبة خارجية)"
        if: steps.check_link_secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions deploy health --no-verify-jwt

      - name: Push payment provider secrets to Supabase (skips any missing one safely)
        if: steps.check_link_secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          declare -A SECRET_VALUES=(
            [SUPABASE_URL]="${{ secrets.SUPABASE_URL }}"
            [SUPABASE_ANON_KEY]="${{ secrets.SUPABASE_ANON_KEY }}"
            [SUPABASE_SERVICE_ROLE_KEY]="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            [APP_ORIGIN]="${{ secrets.APP_ORIGIN }}"
            [MOYASAR_SECRET_KEY]="${{ secrets.MOYASAR_SECRET_KEY }}"
            [MOYASAR_WEBHOOK_SECRET]="${{ secrets.MOYASAR_WEBHOOK_SECRET }}"
            [STRIPE_SECRET_KEY]="${{ secrets.STRIPE_SECRET_KEY }}"
            [STRIPE_WEBHOOK_SECRET]="${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            [TAMARA_API_TOKEN]="${{ secrets.TAMARA_API_TOKEN }}"
            [TAMARA_NOTIFICATION_TOKEN]="${{ secrets.TAMARA_NOTIFICATION_TOKEN }}"
            [WHATSAPP_ACCESS_TOKEN]="${{ secrets.WHATSAPP_ACCESS_TOKEN }}"
            [WHATSAPP_PHONE_NUMBER_ID]="${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}"
            [WHATSAPP_TEMPLATE_NAME]="${{ secrets.WHATSAPP_TEMPLATE_NAME }}"
            [WHATSAPP_TEMPLATE_LANG]="${{ secrets.WHATSAPP_TEMPLATE_LANG }}"
            [OTP_HASH_SECRET]="${{ secrets.OTP_HASH_SECRET }}"
            [GOOGLE_PLACES_API_KEY]="${{ secrets.GOOGLE_PLACES_API_KEY }}"
          )
          MISSING=""
          for KEY in "${!SECRET_VALUES[@]}"; do
            VALUE="${SECRET_VALUES[$KEY]}"
            if [ -n "$VALUE" ]; then
              npx supabase secrets set "$KEY=$VALUE"
            else
              MISSING="$MISSING $KEY"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::أسرار غائبة لم تُضبَط بعد في Supabase (أضفها في GitHub Secrets لتفعيل الدفع الفعلي):$MISSING"
          fi
