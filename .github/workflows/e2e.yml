# وحدة + E2E + Visual regression + متصفحات متعددة
name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # تدقيق 2026-07-08: كانت اختبارات الوحدة (npm test، 226+ اختباراً بما فيها حراس
  # الانحدار لمونت كارلو والزكاة/الضريبة وتماسك القرار) لا تُشغَّل في أي CI إطلاقاً —
  # فقط Playwright e2e أدناه. أي انحدار في المحرك المالي كان يمكن أن يُدمَج ويُنشَر
  # دون أن يوقفه شيء. هذه الوظيفة تفشل البناء عند أي اختبار فاشل أو تغطية تحت العتبة.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: "Run E2E (all projects: Chromium, Firefox, WebKit)"
        run: npm run test:e2e:all-browsers
        env:
          CI: true
          # تدقيق 2026-08-21: بلا هذا، خادم dev داخل CI يشغّل بإعداد Supabase الافتراضي
          # المُضمَّن بالكود، وهو "محظور صراحة" في وضع dev الأمني (blockedInDev بـ
          # supabaseClient.js) لمنع كتابة بيانات محلية بالخطأ على قاعدة الإنتاج —
          # فيظهر تنبيه "أضف SUPABASE_URL..." بدل نموذج الدخول الفعلي، وتفشل كل
          # الاختبارات التي تتحقق من واجهة المصادقة. هذا العلم هو نفس مخرج الطوارئ
          # الموثَّق أصلاً بالتحذير نفسه — لا حاجة لتكرار URL/anon key (عمومي أصلاً)
          # كأسرار CI منفصلة.
          VITE_ALLOW_DEFAULT_SUPABASE_IN_DEV: true
          # تدقيق 2026-08-22: #/step/N و#/category/N صارتا تتطلبان تسجيل دخول أيضاً
          # (إغلاق فجوة اتساق موثّقة بـAI_HANDOFF.md) — أي اختبار e2e يصل لمحتوى
          # المعالج مباشرة يحتاج هذين السرّين الآن (e2e/helpers/auth.js: loginTestUser).
          # غير مضبوطين بعد بمستودع GitHub وقت هذا التغيير → القيمة فارغة →
          # hasE2ECredentials() ترجع false → الاختبارات المعنية تتخطّى نفسها (test.skip)
          # بدل الفشل، لا كتابة بيانات فعلية تحدث. أضِفهما كـSecrets حقيقيّين
          # (Settings → Secrets and variables → Actions) لتفعيل هذه الاختبارات فعلياً.
          E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
          E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
