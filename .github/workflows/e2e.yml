# وحدة + E2E + Visual regression + متصفحات متعددة
name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# تدقيق 2026-08-29 (المرحلة 1.3، خطة إعادة تقييم الطبقات الـ16): لا خطر في إلغاء
# تشغيلة اختبار قديمة حين يصل دفع أحدث لنفس الفرع — كل ما يحدث هو أن حدث
# workflow_run الناتج عن التشغيلة المُلغاة يصل بـconclusion=cancelled فيتجاهله
# حارس النشر (supabase-migrations.yml/supabase-functions-deploy.yml)، بينما
# التشغيلة الأحدث تكمل وتُطلق نشرها الخاص بأحدث SHA فعلياً — لا نشر يُفقَد.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # تدقيق 2026-08-26 (نُقلت من .github/workflows/ci.yml بالمرحلة 1.2، خطة إعادة
  # تقييم الطبقات الـ16 2026-08-29): كانت CI Pipeline وE2E Tests ورشتَي عمل
  # منفصلتين تعملان بالتوازي على كل push لـmain — ما يعني عدم وجود اسم ورشة
  # اختبار واحد يمكن لورشتَي نشر Supabase (ترحيلات + Edge Functions) الانتظار
  # عليه عبر workflow_run. نُقلت هذه الوظيفة هنا حرفياً بلا أي تغيير على خطواتها
  # لتصبح "E2E Tests" الاسم الوحيد الذي تُبنى عليه بوابة النشر بعد نجاح الاختبار.
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      # تدقيق 2026-08-29 (حارس رتابة الترحيلات): fetch-depth: 0 إلزامي هنا — بلا هذا
      # (الافتراضي ضحل، fetch-depth: 1) فإن web/js/core/__tests__/migrationIntroductionOrder
      # Monotonicity.guard.test.js (ضمن npm run test أدناه) يفقد تاريخ Git الكامل الذي
      # يعتمد عليه (git log --follow) فيمرّ أخضر صامتاً بدل اكتشاف أي مخالفة حقيقية.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test

      # تدقيق 2026-08-26: `scripts/measure-bundle.mjs` كان يحسب الحمولة الأولية الحقيقية
      # (المدخل + كل استيراد ثابت متعدٍّ + modulepreload) بحجمها الخام وbrotli، لكنه أداة
      # يدوية فقط — لا ميزانية مفروضة تمنع تضخّم الحزمة صامتاً. كما أن `npm run build` نفسها
      # لم تكن تُشغَّل في أي CI أصلاً (لا هنا، ولا بـe2e.yml الذي يشغّل خادم dev مباشرة عبر
      # Playwright webServer بلا بناء إنتاجي). أُضيفت خطوة Build هنا لأول مرة، وبعدها بوابة
      # الميزانية. القياس الفعلي بهذا التاريخ عبر بناء نظيف: إجمالي brotli للحمولة الأولية
      # (main-*.js + استيراداته الثابتة المتعدّية + modulepreload) = 276888 بايت. العتبة
      # أدناه 307200 بايت (300 KiB) — هامش ~11% فوق القياس الفعلي، بنفس نمط ratchet التغطية
      # في vite.config.js. تُرفع العتبة فقط مع تضخّم متعمَّد موثَّق (ميزة جديدة تستحق الوزن)،
      # ولا تُخفَّض أبداً بتجاهل فشلها.
      - name: Build
        run: npm run build

      - name: Bundle size budget (initial payload, brotli)
        run: node scripts/measure-bundle.mjs --budget=307200

  # تدقيق 2026-07-08: كانت اختبارات الوحدة (npm test، 226+ اختباراً بما فيها حراس
  # الانحدار لمونت كارلو والزكاة/الضريبة وتماسك القرار) لا تُشغَّل في أي CI إطلاقاً —
  # فقط Playwright e2e أدناه. أي انحدار في المحرك المالي كان يمكن أن يُدمَج ويُنشَر
  # دون أن يوقفه شيء. هذه الوظيفة تفشل البناء عند أي اختبار فاشل أو تغطية تحت العتبة.
  unit:
    runs-on: ubuntu-latest
    steps:
      # تدقيق 2026-08-29 (حارس رتابة الترحيلات): fetch-depth: 0 إلزامي هنا — نفس سبب
      # وظيفة test-frontend أعلاه: بلا تاريخ Git كامل، migrationIntroductionOrderMonotonicity
      # .guard.test.js (يعمل ضمن npm run test:coverage هنا) يمرّ أخضر صامتاً بدل الفحص الفعلي.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # تدقيق 2026-08-26: أُضيف e2e/a11y.spec.js (axe-core، وسوم wcag2a/wcag2aa/
      # wcag21a/wcag21aa فقط — لا best-practice) على landing.html/pricing.html/
      # help.html. القياس الفعلي وقت الإضافة: صفر مخالفة عبر الصفحات الثلاث (مقابل
      # اكتشاف يدوي سابق لثغرة واحدة فقط عبر 77 حقلاً — انظر MEMORY). بما أن الصفحة
      # صفرية فعلاً لا تخمينية، الفحص **حاجب** بلا استثناء — يفشل هذه الخطوة تلقائياً
      # (a11y.spec.js جزء من مجلد e2e/ أدناه، بلا continue-on-error). أي رفع لهذه
      # البوابة لاحقاً يحتاج مراجعة موثّقة صريحة مثل هذه (نفس نمط ratchet التغطية
      # بـvite.config.js)، لا إسكاتاً صامتاً لفشل حقيقي.
      - name: "Run E2E (all projects: Chromium, Firefox, WebKit)"
        run: npm run test:e2e:all-browsers
        env:
          CI: true
          # تدقيق 2026-08-21: بلا هذا، خادم dev داخل CI يشغّل بإعداد Supabase الافتراضي
          # المُضمَّن بالكود، وهو "محظور صراحة" في وضع dev الأمني (blockedInDev بـ
          # supabaseClient.js) لمنع كتابة بيانات محلية بالخطأ على قاعدة الإنتاج —
          # فيظهر تنبيه "أضف SUPABASE_URL..." بدل نموذج الدخول الفعلي، وتفشل كل
          # الاختبارات التي تتحقق من واجهة المصادقة. هذا العلم هو نفس مخرج الطوارئ
          # الموثَّق أصلاً بالتحذير نفسه — لا حاجة لتكرار URL/anon key (عمومي أصلاً)
          # كأسرار CI منفصلة.
          VITE_ALLOW_DEFAULT_SUPABASE_IN_DEV: true
          # تدقيق 2026-08-22: #/step/N و#/category/N صارتا تتطلبان تسجيل دخول أيضاً
          # (إغلاق فجوة اتساق موثّقة بـAI_HANDOFF.md) — أي اختبار e2e يصل لمحتوى
          # المعالج مباشرة يحتاج هذين السرّين الآن (e2e/helpers/auth.js: loginTestUser).
          # غير مضبوطين بعد بمستودع GitHub وقت هذا التغيير → القيمة فارغة →
          # hasE2ECredentials() ترجع false → الاختبارات المعنية تتخطّى نفسها (test.skip)
          # بدل الفشل، لا كتابة بيانات فعلية تحدث. أضِفهما كـSecrets حقيقيّين
          # (Settings → Secrets and variables → Actions) لتفعيل هذه الاختبارات فعلياً.
          E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
          E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
