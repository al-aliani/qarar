# وحدة + E2E + Visual regression + متصفحات متعددة
name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # تدقيق 2026-07-08: كانت اختبارات الوحدة (npm test، 226+ اختباراً بما فيها حراس
  # الانحدار لمونت كارلو والزكاة/الضريبة وتماسك القرار) لا تُشغَّل في أي CI إطلاقاً —
  # فقط Playwright e2e أدناه. أي انحدار في المحرك المالي كان يمكن أن يُدمَج ويُنشَر
  # دون أن يوقفه شيء. هذه الوظيفة تفشل البناء عند أي اختبار فاشل أو تغطية تحت العتبة.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: "Run E2E (all projects: Chromium, Firefox, WebKit)"
        run: npm run test:e2e:all-browsers
        env:
          CI: true
          # تدقيق 2026-08-21: بلا هذا، خادم dev داخل CI يشغّل بإعداد Supabase الافتراضي
          # المُضمَّن بالكود، وهو "محظور صراحة" في وضع dev الأمني (blockedInDev بـ
          # supabaseClient.js) لمنع كتابة بيانات محلية بالخطأ على قاعدة الإنتاج —
          # فيظهر تنبيه "أضف SUPABASE_URL..." بدل نموذج الدخول الفعلي، وتفشل كل
          # الاختبارات التي تتحقق من واجهة المصادقة. هذا العلم هو نفس مخرج الطوارئ
          # الموثَّق أصلاً بالتحذير نفسه — لا حاجة لتكرار URL/anon key (عمومي أصلاً)
          # كأسرار CI منفصلة؛ لا كتابة بيانات فعلية تحدث (E2E_CUSTOMER_EMAIL/PASSWORD
          # غير مضبوطين بعد بهذا الـCI، فاختبارات تسجيل الدخول الحقيقي تتخطى نفسها).
          VITE_ALLOW_DEFAULT_SUPABASE_IN_DEV: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # مؤقّتة — تُحذف بعد أول تشغيل ناجح (راجع تعليق الكوميت). تُنشئ لقطات Linux
  # المرجعية لـe2e/visual.spec.js وتدفعها للفرع مباشرة، لا كـartifact، لأن رفع
  # الحصة (Actions storage quota) هنا معطَّل مؤقتاً وإعادة حسابه يستغرق 6-12 ساعة
  # (docs.github.com/en/billing/.../about-billing-for-github-actions). Docker غير
  # متاح محلياً لمطابقة ubuntu-latest تماماً، فهذا البديل الوحيد المتبقي لهذه المرة.
  gen-visual-snapshots-linux:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Generate Linux snapshots
        run: npx playwright test e2e/visual.spec.js --project=chromium --project=firefox --project=webkit --update-snapshots
        env:
          CI: true
          VITE_ALLOW_DEFAULT_SUPABASE_IN_DEV: true
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.js-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "chore(e2e): توليد لقطات Linux المرجعية لـvisual.spec.js [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No snapshot changes to commit."
          fi
