# ═══════════════════════════════════════════════════════════════════════
# اختبار الطفرات (Mutation Testing) — تشغيل يدوي فقط
# ═══════════════════════════════════════════════════════════════════════
# لماذا ورشة منفصلة لا خطوة داخل ci.yml؟ قياس محلي فعلي (2026-08-26) على نفس
# النطاق أدناه (web/js/core/engine.js + web/js/core/financial/*.js +
# lib/calc/*.js + web/js/core/store.js — أعلى الملفات خطورةً وأكثرها تعرّضاً
# لعيوب صامتة نجت من ٢٤٠٠+ اختبار خضراء): 21 ملفاً ⟶ 5966 طفرة. تشغيل تجريبي
# (concurrency=4، نفس رتبة أنوية عدّاء ubuntu-latest) أُوقف يدوياً بعد ~6
# دقائق عند 1558/5954 مُختبَرة — تقدير Stryker الحي نفسه للوقت المتبقي كان
# يتصاعد من ~ساعة و49 دقيقة إلى ~7 ساعات ونصف مع تعمّقه في طفرات engine.js/
# store.js (تغطية اختبارية أوسع بكثير لكل طفرة فيهما ⟶ كل طفرة تُشغِّل مئات
# الاختبارات لا عشرات). حتى تشغيل استهلالي واحد (dry run لبناء خريطة التغطية)
# يستغرق وحده ~3 دقائق قبل أي طفرة فعلية. طويل جداً ليكون خطوة حاجبة أو حتى
# غير حاجبة داخل كل push/PR (سيُبطئ كل تدفق المساهمين، لا فقط من يلمس المحرك
# المالي). التشغيل هنا عند الطلب فقط، بعد أي تغيير مقصود في محرّك الحساب
# المالي يستحق تدقيق قوة الاختبارات الفعلية لا مجرد اخضرارها.
#
# لماذا لا يُفشل البناء؟ لا توجد بعد عتبة (threshold) تاريخية موثوقة لنسبة
# الطفرات الملتقَطة على هذا النطاق تحديداً — انظر تقرير التأسيس. يُترك التقييم
# اليدوي للتقرير المرفوع كأرشيف حتى تتراكم بيانات كافية لعتبة واقعية.
# ═══════════════════════════════════════════════════════════════════════

name: Mutation Testing (manual)

on:
  workflow_dispatch: {}

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mutation testing (engine + financial + calc + store)
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
