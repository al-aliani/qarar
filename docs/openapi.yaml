# توثيق API — محاكي الجدوى
# نقاط التكامل مع Supabase (Auth + Studies) للاستخدام المستقبلي أو Backend
# قابل للعرض في Swagger UI / Redoc

openapi: 3.0.3
info:
  title: محاكي الجدوى — API
  description: |
    وصف نقاط التكامل مع المصادقة والحفظ السحابي (Supabase).
    التطبيق الحالي يستدعي هذه العمليات من الواجهة عبر `web/supabaseClient.js`.
  version: 1.0.0
  contact:
    name: فريق محاكي الجدوى

servers:
  - url: https://YOUR_PROJECT_REF.supabase.co
    description: Supabase (Auth + REST)
  - url: /
    description: التطبيق الأمامي

tags:
  - name: Auth
    description: المصادقة والمستخدم
  - name: Studies
    description: دراسات الجدوى

paths:
  /auth/v1/token?grant_type=password:
    post:
      tags: [Auth]
      summary: تسجيل الدخول (بريد + كلمة مرور)
      description: يقابله في العميل `signIn(email, password)`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: نجاح — إرجاع access_token و refresh_token
        '400':
          description: البريد أو كلمة المرور غير صحيحة أو البريد غير مفعّل

  /auth/v1/signup:
    post:
      tags: [Auth]
      summary: إنشاء حساب
      description: يقابله في العميل `signUp(email, password)`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: تم إنشاء الحساب (قد يتطلب تأكيد البريد)
        '400':
          description: خطأ في البيانات أو البريد مستخدم

  /auth/v1/authorize:
    get:
      tags: [Auth]
      summary: تسجيل الدخول بـ OAuth (Google)
      description: يقابله في العميل `signInWithOAuth('google')` ثم إعادة توجيه.
      parameters:
        - name: provider
          in: query
          schema:
            type: string
            enum: [google]
      responses:
        '302':
          description: إعادة توجيه إلى مزود OAuth

  /rest/v1/studies:
    get:
      tags: [Studies]
      summary: قائمة دراسات المستخدم
      description: يقابله في العميل `loadStudies()`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: مصفوفة دراسات
    post:
      tags: [Studies]
      summary: حفظ/تحديث دراسة
      description: يقابله في العميل `saveStudy(studyId, studyData)` (upsert).
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, format: uuid }
                title: { type: string }
                data: { type: object }
                user_id: { type: string, format: uuid }
      responses:
        '200':
          description: تم الحفظ
        '401':
          description: غير مصرح

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
